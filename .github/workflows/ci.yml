name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate OpenAI submission pack
        run: python scripts/validate_openai_submission.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Run Clippy
        run: cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo +stable test --locked --workspace --all-features

      - name: Run doc-tests
        run: cargo +stable test --locked --workspace --doc

      - name: Build workspace
        run: cargo +stable build --locked --workspace

      - name: Smoke-test Linux XDG defaults
        if: matrix.os == 'ubuntu-latest'
        run: |
          tmp="$(mktemp -d)"
          rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          export HOME="$tmp/home"
          export RUSTUP_HOME="$rustup_home"
          export XDG_DATA_HOME="$tmp/data"
          export XDG_RUNTIME_DIR="$tmp/runtime"
          mkdir -p "$HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          cargo run --quiet -- status
          test -f "$XDG_DATA_HOME/taskrail/registry.sqlite3"
          cargo run --quiet -- scan --source systemd --json
          cargo run --quiet -- scan --source cron --json

  msrv:
    name: MSRV (1.88.0)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.88.0

      - name: Check workspace with MSRV
        run: cargo +1.88.0 check --locked --workspace --all-features

      - name: Run workspace tests with MSRV
        run: cargo +1.88.0 test --locked --workspace --all-features

  package:
    name: Cargo package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: stable

      - name: Validate crate packaging
        run: cargo +stable package --locked --package taskrail

  desktop:
    name: Swift desktop client
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build desktop client
        working-directory: macos/DesktopApp
        run: swift build

      - name: Run desktop client tests
        working-directory: macos/DesktopApp
        run: swift test
