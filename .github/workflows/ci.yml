name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate OpenAI submission pack
        run: python3 scripts/validate_openai_submission.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Smoke-test Linux XDG defaults
        if: matrix.os == 'ubuntu-latest'
        run: |
          tmp="$(mktemp -d)"
          export HOME="$tmp/home"
          export XDG_DATA_HOME="$tmp/data"
          export XDG_RUNTIME_DIR="$tmp/runtime"
          mkdir -p "$HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          cargo run --quiet -- status
          test -f "$XDG_DATA_HOME/taskrail/registry.sqlite3"
          cargo run --quiet -- scan --source systemd --json
          cargo run --quiet -- scan --source cron --json

  desktop:
    name: Swift desktop client
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build desktop client
        working-directory: macos/DesktopApp
        run: swift build

      - name: Run desktop client tests
        working-directory: macos/DesktopApp
        run: swift test
