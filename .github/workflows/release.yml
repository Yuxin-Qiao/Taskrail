name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux release asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build and package
        run: |
          cargo build --release --package taskrail
          tar -C target/release -czf "taskrail-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" taskrail
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux
          path: taskrail-*.tar.gz

  macos:
    name: macOS release assets
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build Rust binary
        run: |
          cargo build --release --package taskrail
          tar -C target/release -czf "taskrail-${GITHUB_REF_NAME}-macos.tar.gz" taskrail
      - name: Build unsigned desktop app bundle
        working-directory: macos/DesktopApp
        run: |
          swift build -c release
          binary="$(find .build -type f -path '*/release/AutomationDesktopApp' -print -quit)"
          test -n "$binary"
          app="Taskrail.app"
          mkdir -p "$app/Contents/MacOS"
          cp "$binary" "$app/Contents/MacOS/taskrail"
          cp Info.plist "$app/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$app" "../../taskrail-${GITHUB_REF_NAME}-macos-unsigned.app.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos
          path: |
            taskrail-*.tar.gz
            taskrail-*.app.zip

  publish:
    name: Publish GitHub release
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/* --generate-notes
