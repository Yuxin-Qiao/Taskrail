name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux release asset
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.88.0

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          expected="${RELEASE_VERSION#v}"
          actual="$(cargo +1.88.0 metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "taskrail") | .version')"
          test "$actual" = "$expected"

      - name: Build and package
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          cargo +1.88.0 build --locked --release --package taskrail
          archive="taskrail-${RELEASE_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -C target/release -czf "$archive" taskrail
          shasum -a 256 "$archive" > "$archive.sha256"
          shasum -a 256 -c "$archive.sha256"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: taskrail-${{ github.ref_name }}-linux.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: taskrail-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
          sbom-path: taskrail-${{ github.ref_name }}-linux.spdx.json

      - name: Upload release materials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-linux
          retention-days: 14
          path: |
            taskrail-*.tar.gz
            taskrail-*.sha256
            taskrail-*.spdx.json

  macos:
    name: macOS release assets
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.88.0

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          expected="${RELEASE_VERSION#v}"
          actual="$(cargo +1.88.0 metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "taskrail") | .version')"
          test "$actual" = "$expected"
          test "$(plutil -extract CFBundleShortVersionString raw macos/DesktopApp/Info.plist)" = "$expected"

      - name: Build Rust binary
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          cargo +1.88.0 build --locked --release --package taskrail
          archive="taskrail-${RELEASE_VERSION}-macos.tar.gz"
          tar -C target/release -czf "$archive" taskrail
          shasum -a 256 "$archive" > "$archive.sha256"
          shasum -a 256 -c "$archive.sha256"

      - name: Build unsigned desktop app bundle
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        working-directory: macos/DesktopApp
        run: |
          swift build -c release
          binary="$(find .build -type f -path '*/release/AutomationDesktopApp' -print -quit)"
          test -n "$binary"
          app="Taskrail.app"
          mkdir -p "$app/Contents/MacOS"
          cp "$binary" "$app/Contents/MacOS/taskrail"
          cp Info.plist "$app/Contents/Info.plist"
          archive="taskrail-${RELEASE_VERSION}-macos-unsigned.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "../../$archive"
          (
            cd ../..
            digest="$(shasum -a 256 "$archive" | awk '{print $1}')"
            printf '%s  %s\n' "$digest" "$archive" > "$archive.sha256"
            shasum -a 256 -c "$archive.sha256"
          )

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: taskrail-${{ github.ref_name }}-macos.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest CLI release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: taskrail-${{ github.ref_name }}-macos.tar.gz
          sbom-path: taskrail-${{ github.ref_name }}-macos.spdx.json

      - name: Upload release materials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-macos
          retention-days: 14
          path: |
            taskrail-*.tar.gz
            taskrail-*.app.zip
            taskrail-*.sha256
            taskrail-*.spdx.json

  publish:
    name: Publish GitHub release
    needs: [linux, macos]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download release materials
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes dist/*
