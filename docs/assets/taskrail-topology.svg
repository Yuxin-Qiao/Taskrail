<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Taskrail automation topology</title>
  <desc id="desc">Automation sources flow into the Taskrail daemon and produce scheduled work, run history, and logs and events.</desc>

  <rect x="1" y="1" width="1598" height="518" rx="24" fill="white" stroke="#E5E5E5" stroke-width="2" />

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="68" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">LOCAL AUTOMATION</text>
    <text x="72" y="106" fill="#171717" font-size="28" font-weight="700">Many sources. One control plane.</text>
    <circle cx="1480" cy="67" r="5" fill="#10A37F" />
    <text x="1498" y="72" text-anchor="end" fill="#525252" font-size="14">runs locally</text>
  </g>

  <path d="M72 135H1528" stroke="#E5E5E5" stroke-width="2" />

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.8">
    <text x="112" y="178" fill="#737373">INPUTS</text>
    <text x="660" y="178" fill="#737373">Taskrail daemon</text>
    <text x="1180" y="178" fill="#737373">OUTPUTS</text>
  </g>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">
    <circle cx="112" cy="232" r="5" fill="#A3A3A3" />
    <text x="136" y="238" fill="#171717">scripts &amp; commands</text>
    <circle cx="112" cy="286" r="5" fill="#A3A3A3" />
    <text x="136" y="292" fill="#171717">cron</text>
    <circle cx="112" cy="340" r="5" fill="#A3A3A3" />
    <text x="136" y="346" fill="#171717">launchd / systemd</text>
    <circle cx="112" cy="394" r="5" fill="#A3A3A3" />
    <text x="136" y="400" fill="#171717">Codex / Mole / integrations</text>
  </g>

  <g stroke="#D4D4D4" stroke-width="2" stroke-linecap="round">
    <path d="M330 232H600" />
    <path d="M330 286H600" />
    <path d="M330 340H600" />
    <path d="M330 394H600" />
  </g>

  <g>
    <rect x="600" y="212" width="400" height="214" rx="12" fill="white" stroke="#171717" stroke-width="2" />
    <rect x="600" y="212" width="400" height="5" rx="2.5" fill="#10A37F" />
    <circle cx="632" cy="250" r="5" fill="#10A37F" />
    <text x="648" y="255" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.8">Taskrail daemon</text>
    <text x="632" y="302" fill="#171717" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700">Registry + scheduler</text>
    <path d="M632 328H968" stroke="#E5E5E5" />
    <text x="632" y="358" fill="#525252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">direct argv</text>
    <text x="632" y="384" fill="#525252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">local run history</text>
    <text x="632" y="410" fill="#10A37F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">every result accounted for</text>
  </g>

  <g stroke="#10A37F" stroke-width="2" stroke-linecap="round">
    <path d="M1000 250H1270" />
    <path d="M1000 318H1270" />
    <path d="M1000 386H1270" />
  </g>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">
    <circle cx="1292" cy="250" r="5" fill="#10A37F" />
    <text x="1316" y="256" fill="#171717">run now</text>
    <circle cx="1292" cy="318" r="5" fill="#10A37F" />
    <text x="1316" y="324" fill="#171717">run next</text>
    <circle cx="1292" cy="386" r="5" fill="#10A37F" />
    <text x="1316" y="392" fill="#171717">logs + events</text>
  </g>

  <path d="M72 458H1528" stroke="#E5E5E5" stroke-width="2" />
  <text x="800" y="490" text-anchor="middle" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.4">DISCOVER  →  SCHEDULE  →  EXECUTE  →  INSPECT</text>
</svg>
