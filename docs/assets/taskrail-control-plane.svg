<svg width="1600" height="610" viewBox="0 0 1600 610" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Taskrail local automation plugin</title>
  <desc id="desc">A plugin-style connection card showing tools entering Taskrail and Taskrail managing local automation runs.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#111111" flood-opacity="0.12" />
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#111111" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect x="1" y="1" width="1598" height="608" rx="28" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2" />

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="75" fill="#111111" font-size="17" font-weight="700">Taskrail</text>
    <text x="72" y="105" fill="#6B6B6B" font-size="16">The local automation plugin for your computer.</text>

    <rect x="1325" y="55" width="203" height="36" rx="18" fill="#F1F1F1" />
    <circle cx="1347" cy="73" r="5" fill="#10A37F" />
    <text x="1360" y="79" fill="#444444" font-size="13" font-weight="600">CONNECTED LOCALLY</text>
  </g>

  <path d="M72 136H1528" stroke="#ECECEC" stroke-width="2" />

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" letter-spacing="1.6">
    <text x="96" y="177" fill="#777777">YOUR TOOLS</text>
    <text x="632" y="177" fill="#777777">TASKRAIL PLUGIN</text>
    <text x="1192" y="177" fill="#777777">WHAT IT MANAGES</text>
  </g>

  <g filter="url(#smallShadow)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="72" y="205" width="360" height="76" rx="16" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2" />
    <circle cx="108" cy="243" r="15" fill="#F1F1F1" />
    <path d="M101 243H115M108 236V250" stroke="#444444" stroke-width="2.5" stroke-linecap="round" />
    <text x="140" y="239" fill="#111111" font-size="17" font-weight="600">Commands &amp; scripts</text>
    <text x="140" y="261" fill="#777777" font-size="13">direct argv · local tools</text>

    <rect x="72" y="299" width="360" height="76" rx="16" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2" />
    <circle cx="108" cy="337" r="15" fill="#F1F1F1" />
    <path d="M108 329V345M101 337H115" stroke="#444444" stroke-width="2.5" stroke-linecap="round" />
    <text x="140" y="333" fill="#111111" font-size="17" font-weight="600">Schedules &amp; native jobs</text>
    <text x="140" y="355" fill="#777777" font-size="13">cron · launchd · systemd</text>

    <rect x="72" y="393" width="360" height="76" rx="16" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2" />
    <circle cx="108" cy="431" r="15" fill="#F1F1F1" />
    <path d="M100 431H116M108 423V439" stroke="#444444" stroke-width="2.5" stroke-linecap="round" />
    <text x="140" y="427" fill="#111111" font-size="17" font-weight="600">AI &amp; integrations</text>
    <text x="140" y="449" fill="#777777" font-size="13">Codex · ChatGPT · Mole</text>
  </g>

  <g filter="url(#shadow)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="540" y="205" width="500" height="264" rx="22" fill="#111111" />
    <rect x="540" y="205" width="500" height="6" rx="3" fill="#10A37F" />
    <circle cx="575" cy="243" r="5" fill="#10A37F" />
    <text x="591" y="249" fill="#AAAAAA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.6">TASKRAIL / LOCAL CONTROL PLANE</text>

    <text x="580" y="303" fill="#FFFFFF" font-size="32" font-weight="700">The middle layer.</text>
    <text x="580" y="332" fill="#A3A3A3" font-size="15">One registry. One scheduler. Every run accounted for.</text>

    <rect x="580" y="361" width="185" height="68" rx="14" fill="#1F1F1F" stroke="#333333" />
    <text x="602" y="389" fill="#10A37F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">CONTROL</text>
    <text x="602" y="410" fill="#E5E5E5" font-size="14">discover · schedule</text>

    <rect x="785" y="361" width="215" height="68" rx="14" fill="#1F1F1F" stroke="#333333" />
    <text x="807" y="389" fill="#10A37F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">EXECUTION</text>
    <text x="807" y="410" fill="#E5E5E5" font-size="14">run · observe · explain</text>
  </g>

  <g filter="url(#smallShadow)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="1168" y="205" width="360" height="76" rx="16" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2" />
    <circle cx="1204" cy="243" r="15" fill="#E9F7F2" />
    <path d="M1197 243L1202 248L1212 237" stroke="#10A37F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="1236" y="239" fill="#111111" font-size="17" font-weight="600">Scheduled work</text>
    <text x="1236" y="261" fill="#777777" font-size="13">what runs next · misfires</text>

    <rect x="1168" y="299" width="360" height="76" rx="16" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2" />
    <circle cx="1204" cy="337" r="15" fill="#E9F7F2" />
    <path d="M1197 337H1211M1204 330V344" stroke="#10A37F" stroke-width="2.5" stroke-linecap="round" />
    <text x="1236" y="333" fill="#111111" font-size="17" font-weight="600">Run history</text>
    <text x="1236" y="355" fill="#777777" font-size="13">stdout · stderr · metrics</text>

    <rect x="1168" y="393" width="360" height="76" rx="16" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2" />
    <circle cx="1204" cy="431" r="15" fill="#E9F7F2" />
    <path d="M1204 422V434M1204 441V442" stroke="#10A37F" stroke-width="3" stroke-linecap="round" />
    <text x="1236" y="427" fill="#111111" font-size="17" font-weight="600">Logs &amp; events</text>
    <text x="1236" y="449" fill="#777777" font-size="13">attention · failures · audit trail</text>
  </g>

  <g fill="none" stroke="#10A37F" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 10">
    <path d="M432 243H524" />
    <path d="M432 337H524" />
    <path d="M432 431H524" />
    <path d="M1056 243H1148" />
    <path d="M1056 337H1148" />
    <path d="M1056 431H1148" />
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" font-size="13" letter-spacing="1.6">
    <text x="252" y="535" fill="#777777">TOOLS IN</text>
    <text x="790" y="535" fill="#10A37F">ONE LOCAL CONTROL PLANE</text>
    <text x="1348" y="535" fill="#777777">RUNS OUT</text>
  </g>
</svg>
